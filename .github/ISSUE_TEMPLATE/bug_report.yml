name: Bug report
description: Something in Tahoe Glass doesn't work, or doesn't look, as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting it. The more exact the steps, the sooner it can be fixed. For a question rather than a bug, Discussions is the place."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Where the glass looks wrong (toolbar, menus, command palette, settings…), light or dark mode, and what's behind it."
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tahoe Glass version
      description: "In Settings → Community plugins."
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version
      description: "In Settings → General."
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - iPhone or iPad
        - Android
    validations:
      required: true
  - type: input
    id: extra
    attributes:
      label: Mac and theme
      description: "Your Mac (Apple silicon or Intel), macOS version, and whether the Tahoe theme is on."
      placeholder: "MacBook Air M2, macOS 26.1, Tahoe theme"
  - type: checkboxes
    id: alone
    attributes:
      label: With other plugins off
      options:
        - label: "It still happens in Restricted mode (Settings → Community plugins), with only Tahoe Glass on."
  - type: textarea
    id: console
    attributes:
      label: Errors from the console
      description: "On desktop: View → Toggle Developer Tools → Console. Paste anything in red that mentions Tahoe Glass."
      render: text
  - type: textarea
    id: more
    attributes:
      label: Screenshots or anything else
